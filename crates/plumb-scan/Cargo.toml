[package]
name = "plumb-scan"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
plumb-core.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_RestartManager"] }
