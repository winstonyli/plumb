# Pushing a tag like v0.7.0 tests the workspace, builds the release exe and publishes it as a GitHub
# release with the matching CHANGELOG.md section as its notes. A tag with a suffix (v0.7.0-rc1) makes a
# prerelease, which is how to try this file out.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked -p plumb

      - name: Package
        run: |
          $tag = "${{ github.ref_name }}"
          $dir = "plumb-$tag-windows-x64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/plumb.exe $dir/
          Copy-Item CHANGELOG.md,LICENSE-MIT,LICENSE-APACHE $dir/
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          $hash = (Get-FileHash "$dir.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline -Encoding ascii "$dir.zip.sha256" "$hash  $dir.zip`n"
          "ASSET=$dir.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Notes
        run: |
          # The CHANGELOG section for the tag's version (v0.7.0-rc1 reads 0.7.0), else [Unreleased].
          $version = ("${{ github.ref_name }}" -replace '^v', '') -replace '-.*$', ''
          $lines = Get-Content CHANGELOG.md
          # Headings are "## 0.9.0 - date" (Common Changelog) or the older "## [0.8.0] - date".
          $head = $lines | Where-Object { $_.StartsWith("## $version ") -or $_.StartsWith("## [$version]") } | Select-Object -First 1
          $start = if ($head) { [array]::IndexOf($lines, $head) + 1 } else { 0 }
          if (-not $start) { $start = ($lines | Select-String -SimpleMatch "## [Unreleased]" | Select-Object -First 1).LineNumber }
          if (-not $start) { throw "no CHANGELOG section for $version" }
          $body = @()
          foreach ($l in $lines[$start..($lines.Count - 1)]) {
            if ($l.StartsWith("## ")) { break }
            $body += $l
          }
          $body += ""
          $body += "The exe is unsigned, so Windows SmartScreen may warn on first run. Check the zip against the .sha256 file."
          if ("${{ github.ref_name }}" -notlike "*-*") {
            $body += ""
            $body += 'Install with Scoop: `scoop bucket add plumb https://github.com/winstonyli/plumb`, then `scoop install plumb`.'
          }
          $body | Out-File -Encoding utf8 notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $pre = @(if ($tag -like "*-*") { "--prerelease" })
          gh release create $tag $env:ASSET "$env:ASSET.sha256" --title $tag --notes-file notes.md --verify-tag @pre

      - name: Bucket
        run: |
          $tag = "${{ github.ref_name }}"
          $sha = ((Get-Content "$env:ASSET.sha256" -Raw) -split '\s+')[0]
          $script = Join-Path $env:RUNNER_TEMP "bump-manifest.ps1"
          Copy-Item .github/scripts/bump-manifest.ps1 $script
          function Invoke-Git { git @args; if ($LASTEXITCODE) { throw "git $args failed ($LASTEXITCODE)" } }
          if ($tag -like "*-*") {
            # A prerelease only shows what the real release would write.
            $dry = Join-Path $env:RUNNER_TEMP "bucket-dry"
            & $script -Tag ($tag -replace '-.*$', '') -Sha256 $sha -Root $dry
            Get-Content "$dry/bucket/plumb.json"
            return
          }
          Invoke-Git fetch origin main
          Invoke-Git checkout -B main origin/main
          & $script -Tag $tag -Sha256 $sha -Root (Get-Location).Path
          Invoke-Git config user.name "github-actions[bot]"
          Invoke-Git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Invoke-Git add bucket/plumb.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { "bucket already current"; return }
          Invoke-Git commit -m "Bump bucket to $tag"
          Invoke-Git pull --rebase origin main
          Invoke-Git push origin HEAD:main
